<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jogo de Adivinhação</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        background-image: url('./math_background.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        padding: 20px;
        min-height: 100vh;
      }
      h1 {
        color: #2e8b57;
      }
      #game-container {
        background-color: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        max-width: 400px;
        margin: 0 auto;
      }
      input[type="number"] {
        padding: 10px;
        font-size: 16px;
        width: 100px;
        margin: 10px;
      }
      button {
        padding: 10px 20px;
        font-size: 16px;
        background-color: #2e8b57;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin: 5px;
      }
      button:hover {
        background-color: #3cb371;
      }
      #mensagem {
        font-size: 18px;
        margin-top: 20px;
        color: #333;
      }
      #burroImagem {
        display: none;
        max-width: 200px;
        margin: 20px auto;
        display: block;
      }
      #videoCelebracao {
        display: none;
        max-width: 300px;
        margin: 20px auto;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <h1>
        🎉 Jogo de Adivinhação do Tommy para pessoas super inteligentes 🎉
      </h1>
      <p>Eu escolhi um número entre 0 e 1000. Tente adivinhar!</p>
      <input
        type="number"
        id="palpite"
        min="0"
        max="1000"
        placeholder="Seu palpite"
      />
      <button onclick="verificarPalpite()">Adivinhar!</button>
      <button onclick="recomecarJogo()">Recomeçar</button>
      <button onclick="sairJogo()">Sair</button>
      <div id="mensagem"></div>
      <img
        id="burroImagem"
        src="https://e7.pngegg.com/pngimages/899/799/png-clipart-urdu-poetry-joke-hindi-love-humour-flesh-love-desktop-wallpaper-thumbnail.png"
        alt="Imagem de um burro"
      />
      <video id="videoCelebracao" src="./confetis.mp4" controls autoplay loop>
        Desculpe, seu navegador não suporta o elemento de vídeo ou o arquivo 'fireworks.mp4' não foi encontrado.
      </video>
      <audio id="burroSom" src="./burro.mp3">
        Desculpe, seu navegador não suporta o elemento de áudio ou o arquivo de som não foi encontrado.
      </audio>
    </div>

    <script>
      // Gera o número secreto
      let numeroSecreto = Math.floor(Math.random() * 1001);
      let tentativas = 0;

      // Garante que a imagem do burro e o vídeo estejam ocultos no início
      document.getElementById("burroImagem").style.display = "none";
      document.getElementById("videoCelebracao").style.display = "none";

      // Carrega o som do burro
      const burroSom = document.getElementById("burroSom");

      function verificarPalpite() {
        const palpiteInput = document.getElementById("palpite");
        const mensagem = document.getElementById("mensagem");
        const burroImagem = document.getElementById("burroImagem");
        const videoCelebracao = document.getElementById("videoCelebracao");
        const palpite = parseInt(palpiteInput.value);
        tentativas++;

        // Esconde a imagem do burro e o vídeo por padrão
        burroImagem.style.display = "none";
        videoCelebracao.style.display = "none";

        // Verifica se o palpite é válido
        if (isNaN(palpite)) {
          mensagem.innerHTML = "😅 Por favor, digite um número sua besta!";
          return;
        }
        if (palpite < 0 || palpite > 1000) {
          mensagem.innerHTML =
            "🚨 O número deve estar entre 0 e 1000! Não sabes ler???";
          return;
        }

        // Verifica se acertou
        if (palpite === numeroSecreto) {
          mensagem.innerHTML = `🎈 PARABÉNS! Você acertou o número ${numeroSecreto} em ${tentativas} tentativas! És o Einstien Supremo🎈<br>Jogue novamente clicando em Recomeçar!`;
          palpiteInput.disabled = true;
          document.querySelector("button[onclick='verificarPalpite()']").disabled = true;
          videoCelebracao.style.display = "block"; // Mostra o vídeo de celebração
          try {
            videoCelebracao.play(); // Tenta reproduzir o vídeo
          } catch (e) {
            mensagem.innerHTML += "<br>⚠️ Não foi possível reproduzir o vídeo. Verifique se o arquivo 'fireworks.mp4' está na mesma pasta do index.html!";
          }
        } else if (palpite < numeroSecreto) {
          mensagem.innerHTML =
            "⬆️ Seu palpite é MUITO BAIXO! Tente um número maior! Percebeste bem???";
          burroImagem.style.display = "block"; // Mostra a imagem do burro
          try {
            burroSom.play(); // Toca o som do burro
          } catch (e) {
            mensagem.innerHTML += "<br>⚠️ Não foi possível tocar o som do burro. Verifique se o arquivo 'burro.mp3' está na mesma pasta do index.html!";
          }
        } else {
          mensagem.innerHTML =
            "⬇️ Seu palpite é MUITO ALTO! Tente um número menor! Percebeste bem???";
          burroImagem.style.display = "block"; // Mostra a imagem do burro
          try {
            burroSom.play(); // Toca o som do burro
          } catch (e) {
            mensagem.innerHTML += "<br>⚠️ Não foi possível tocar o som do burro. Verifique se o arquivo 'burro.mp3' está na mesma pasta do index.html!";
          }
        }

        // Dica a cada 3 tentativas
        if (tentativas % 3 === 0) {
          if (numeroSecreto % 2 === 0) {
            mensagem.innerHTML +=
              "<br>💡 Dica: O número secreto é PAR sua anta!";
          } else {
            mensagem.innerHTML +=
              "<br>💡 Dica: O número secreto é ÍMPAR sua anta";
          }
        }

        palpiteInput.value = "";
        palpiteInput.focus();
      }

      function recomecarJogo() {
        // Reseta o jogo
        numeroSecreto = Math.floor(Math.random() * 1001);
        tentativas = 0;
        const palpiteInput = document.getElementById("palpite");
        const mensagem = document.getElementById("mensagem");
        const burroImagem = document.getElementById("burroImagem");
        const videoCelebracao = document.getElementById("videoCelebracao");
        palpiteInput.value = "";
        palpiteInput.disabled = false;
        document.querySelector("button[onclick='verificarPalpite()']").disabled = false;
        mensagem.innerHTML = "";
        burroImagem.style.display = "none";
        videoCelebracao.style.display = "none";
        videoCelebracao.pause(); // Pausa o vídeo ao recomeçar
        videoCelebracao.currentTime = 0; // Reseta o vídeo para o início
        palpiteInput.focus();
      }

      function sairJogo() {
        // Tenta fechar a aba do navegador
        window.close();
        // Caso o navegador não permita fechar, exibe uma mensagem
        document.getElementById("mensagem").innerHTML =
          "🚪 Não foi possível fechar a aba. Feche manualmente ou clique em Recomeçar para jogar novamente!";
      }

      // Permite usar a tecla Enter para enviar o palpite
      document
        .getElementById("palpite")
        .addEventListener("keypress", function (event) {
          if (event.key === "Enter") {
            verificarPalpite();
          }
        });
    </script>
  </body>
</html>
